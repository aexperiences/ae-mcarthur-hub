<html lang="en">
<head>

<style>
.ct-tools{display:flex;gap:9px;flex-wrap:wrap;align-items:center;margin:2px 0 12px}
.ct-search{flex:1;min-width:210px}
.ct-search input,.ct-tools select{width:100%;padding:9px 12px;border-radius:9px;border:1px solid var(--line);background:var(--card);font:inherit;font-size:13.5px;color:var(--ink)}
.ct-tools select{width:auto;cursor:pointer}
.ct-chips{display:flex;gap:9px;flex-wrap:wrap;margin-bottom:12px}
.ct-chip{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:7px 12px;font-size:12px;color:var(--mut)}
.ct-chip b{font-size:15px;color:var(--ink);margin-right:5px}
.ct-detail td{background:var(--sunk)!important}
.ct-actions{display:flex;gap:8px;flex-wrap:wrap;margin:4px 0}
.ct-actions a,.ct-actions button{font:inherit;font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink-2);cursor:pointer;text-decoration:none}
.ct-actions a:hover{border-color:var(--blue)}
.ct-del{color:#8a3d2f!important}
.ct-modal{position:fixed;inset:0;background:rgba(20,26,32,.5);display:none;align-items:center;justify-content:center;z-index:600;padding:16px}
.ct-modal.on{display:flex}
.ct-mcard{background:var(--paper);border-radius:14px;max-width:520px;width:100%;padding:22px;max-height:90vh;overflow:auto}
.ct-mcard h3{margin:0 0 10px}
.ct-mcard label{display:block;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:10px 0 4px}
.ct-mcard input,.ct-mcard textarea{width:100%;box-sizing:border-box;padding:9px 11px;border-radius:8px;border:1px solid var(--line);font:inherit;font-size:13.5px;background:var(--card)}
.ct-mrow{display:flex;gap:10px}.ct-mrow>div{flex:1}
</style>
</head>
<body>

, "v": "Functional/Integrative Medicine", "c": "Coeur d'Alene area", "p": "", "w": "https://functionalmedicine-ni.com/", "f": "Jessica LaPlante", "note": "NP-led functional-medicine family practice, 5 nurse practitioners with functional-medicine training; overlaps Barry's lane but different practitioner type (NP v", "k": "Health & Wellness"}, {"n": "Summit Family Chiropractic (MaxLiving)", "v": "Chiropractic", "c": "Coeur d'Alene", "p": "(208) 664-1000", "w": "https://www.maxliving.com/clinic/summit-family-chiropractic-coeur-d-alene/about", "f": "Ryan Sousley", "note": "Husband-wife DC team (Ryan & Erin Sousley), both certified in functional medicine; established MaxLiving-affiliate practice — strong musculoskeletal complement", "k": "Health & Wellness"}, {"n": "Higgins Clinic NW", "v": "Chiropractic", "c": "Coeur d'Alene", "p": "(208) 765-1250", "w": "https://www.higginsnw.com/services/", "f": "", "note": "IV vitamin therapy, regenerative injection therapy, functional medicine, neural therapy for chronic pain — distinct modality set, strong complement; street addr", "k": "Health & Wellness"}, {"n": "CDA Chiropractic Therapeutics & Massage", "v": "Chiropractic", "c": "Coeur d'Alene", "p": "", "w": "https://cdachirotx.com/", "f": "", "note": "Chiropractic + massage; thin public info on owner/scope — confirm before outreach", "k": "Health & Wellness"}, {"n": "Peony Acupuncture & Apothecary", "v": "Acupuncture / Chinese Medicine", "c": "Coeur d'Alene", "p": "", "w": "https://www.peonyacupuncture.com/", "f": "Lise Takashina", "note": "Board certified (NCCAOM), dual-licensed ID + CA; downtown CDA location — well-documented, strong complement", "k": "Health & Wellness"}, {"n": "White Cypress Natural Health", "v": "Acupuncture / Chinese Medicine", "c": "Coeur d'Alene", "p": "(208) 666-4666", "w": "https://whitecypress.net/contact/", "f": "Lindsey Sichelstiel", "note": "Licensed acupuncturist, real street address + phone + email published — easiest of the acupuncture group to actually reach", "k": "Health & Wellness"}, {"n": "Awakenings Acupuncture", "v": "Acupuncture / Chinese Medicine", "c": "Hayden", "p": "", "w": "https://awakeningsacupuncture.com/", "f": "Jeanette Morris", "note": "Nationally certified Chinese herbalist + licensed acupuncturist; Hayden location, near CDA/Post Falls/Spokane; street address not published — confirm", "k": "Health & Wellness"}, {"n": "CDA Acupuncture & Holistic Healing Center", "v": "Acupuncture / Chinese Medicine", "c": "Coeur d'Alene", "p": "", "w": "https://cdahealing.com/", "f": "", "note": "Real street address published; part of a broader holistic-healing clinic — worth a direct visit", "k": "Health & Wellness"}, {"n": "Bodhicitta Counseling", "v": "Mental Health / Counseling", "c": "Coeur d'Alene", "p": "", "w": "https://www.bcounselingllc.com/", "f": "", "note": "EMDR-trained, trauma/addiction focus; mental health is a real care gap for a solo NMD practice — strong referral complement", "k": "Health & Wellness"}, {"n": "Raising Resilience Holistic Counseling", "v": "Mental Health / Counseling", "c": "Coeur d'Alene", "p": "", "w": "https://www.raisingresilienceidaho.com/", "f": "", "note": "Trauma-focused, holistic mind/body framing — philosophical alignment with Barry's whole-person approach", "k": "Health & Wellness"}, {"n": "Coeur d'Mind Counseling", "v": "Mental Health / Counseling", "c": "Coeur d'Alene", "p": "", "w": "https://coeurdmindcounseling.org/", "f": "", "note": "Holistic mind/body/spirit approach; thinner public info on individual clinicians — confirm before outreach", "k": "Health & Wellness"}, {"n": "Orthopedic Sports Institute", "v": "Physical Therapy", "c": "Coeur d'Alene", "p": "", "w": "https://orthopedicsportsinstitute.com/physical-therapy/", "f": "", "note": "Outpatient orthopedic + sports rehab; real street address; strong musculoskeletal-referral complement", "k": "Health & Wellness"}, {"n": "Inspire Physical Therapy Idaho", "v": "Physical Therapy", "c": "Coeur d'Alene", "p": "(208) 665-7055", "w": "https://www.facebook.com/inspirePhysicalTherapyIdaho/", "f": "", "note": "Sports injuries, chronic spine, post-surgical rehab; real address + phone published", "k": "Health & Wellness"}, {"n": "ActiveNW Physical Therapy & Wellness", "v": "Physical Therapy", "c": "Coeur d'Alene", "p": "(208) 215-2210", "w": "https://activenwpt.com/", "f": "", "note": "Back/neck pain, injury rehab, movement & posture analysis, running assessment; real address + phone", "k": "Health & Wellness"}, {"n": "Hayden Lake Physical Therapy & Aquatics", "v": "Physical Therapy", "c": "Hayden", "p": "(208) 667-6264", "w": "https://haydenlakept.com/", "f": "", "note": "Balance/dizziness specialty + aquatic post-surgical rehab; niche fit, street address not published — confirm", "k": "Health & Wellness"}, {"n": "River City Physical Therapy", "v": "Physical Therapy", "c": "Post Falls", "p": "(208) 777-7800", "w": "https://www.rivercitypt.com/", "f": "", "note": "Orthopedic rehab + sports medicine; Post Falls (Kootenai County, ~10 min from CDA); real address + phone", "k": "Health & Wellness"}, {"n": "Welch Comer Engineers & Surveyors", "v": "Engineering", "c": "Coeur d'Alene", "p": "", "w": "", "f": "", "note": "From Kootenai stack recon (Jul 2026); details to be filled from the master.", "k": "Business"}, {"n": "Northwest Realty Group", "v": "Real Estate", "c": "", "p": "", "w": "", "f": "", "note": "From Kootenai stack recon (Jul 2026); details to be filled from the master.", "k": "Business"}, {"n": "Century 21 Beutler & Associates", "v": "Real Estate", "c": "", "p": "", "w": "", "f": "", "note": "From Kootenai stack recon (Jul 2026); details to be filled from the master.", "k": "Business"}, {"n": "Avant Coeur Gymnastics", "v": "Kids Gym", "c": "", "p": "", "w": "", "f": "", "note": "From Kootenai stack recon (Jul 2026); details to be filled from the master.", "k": "Business"}];
  function load(){ try{ var d=JSON.parse(sessionStorage.getItem(KEY)); if(d&&d.length) return d; }catch(e){} return SEED.slice(); }
  function persist(){ try{ sessionStorage.setItem(KEY,JSON.stringify(ROWS)); }catch(e){} }
  var ROWS=load(), Q="", FV="", FC="", SORT="n", OPEN=-1;

  c.appendChild(T.page("Contacts — the Kootenai book",
    "Every business and practitioner on file for Kootenai County — the same master book behind the other AE hubs. Search it, filter it, call from it. Import the fuller master any time as a CSV; export takes it back out."));

  var host=document.createElement("div"); c.appendChild(host);

  function esc(s){ return T.esc(s); }
  function verts(){ var s={}; ROWS.forEach(function(r){ if(r.v)s[r.v]=1; }); return Object.keys(s).sort(); }
  function cities(){ var s={}; ROWS.forEach(function(r){ if(r.c)s[r.c]=1; }); return Object.keys(s).sort(); }
  function filtered(){
    var q=Q.toLowerCase();
    var out=ROWS.map(function(r,i){ r._i=i; return r; }).filter(function(r){
      if(FV&&r.v!==FV) return false;
      if(FC&&r.c!==FC) return false;
      if(!q) return true;
      return (r.n+" "+r.v+" "+r.c+" "+(r.f||"")+" "+(r.note||"")).toLowerCase().indexOf(q)>-1;
    });
    out.sort(function(a,b){ var ka=(a[SORT]||"").toLowerCase(), kb=(b[SORT]||"").toLowerCase(); return ka<kb?-1:ka>kb?1:0; });
    return out;
  }
  function link(u){ if(!u) return ""; return /^https?:/.test(u)?u:"https://"+u; }

  function render(){
    var list=filtered();
    var vset=verts(), cset=cities();
    var health=ROWS.filter(function(r){return r.k==="Health & Wellness";}).length;
    host.innerHTML=
      '<div class="ct-chips"><span class="ct-chip"><b>'+ROWS.length+'</b> contacts</span>'+
      '<span class="ct-chip"><b>'+(ROWS.length-health)+'</b> businesses</span>'+
      '<span class="ct-chip"><b>'+health+'</b> health &amp; wellness</span>'+
      '<span class="ct-chip"><b>'+cset.length+'</b> cities</span></div>'+
      '<div class="ct-tools">'+
      '<div class="ct-search"><input id="ctQ" placeholder="Search name, city, category, notes…" value="'+esc(Q)+'"></div>'+
      '<select id="ctV"><option value="">All categories</option>'+vset.map(function(v){return '<option '+(v===FV?"selected":"")+'>'+esc(v)+'</option>';}).join("")+'</select>'+
      '<select id="ctC"><option value="">All cities</option>'+cset.map(function(v){return '<option '+(v===FC?"selected":"")+'>'+esc(v)+'</option>';}).join("")+'</select>'+
      '<select id="ctS"><option value="n" '+(SORT==="n"?"selected":"")+'>Sort: Name</option><option value="v" '+(SORT==="v"?"selected":"")+'>Sort: Category</option><option value="c" '+(SORT==="c"?"selected":"")+'>Sort: City</option></select>'+
      '<button class="btn blue sm" id="ctAdd">+ Add</button>'+
      '<button class="btn sm" id="ctImp">Import CSV</button>'+
      '<button class="btn sm" id="ctExp">Export</button>'+
      '</div>'+
      '<div class="cardX">'+ 
      '<table><thead><tr><th>Name</th><th>Category</th><th>City</th><th>Phone</th><th>Website</th></tr></thead><tbody>'+
      (list.length?list.map(function(r){
        var open=r._i===OPEN;
        var row='<tr data-i="'+r._i+'"><td><div class="t-main">'+esc(r.n)+'</div>'+(r.f?'<div class="t-sub">'+esc(r.f)+'</div>':'')+'</td>'+
          '<td>'+esc(r.v||"—")+'</td><td>'+esc(r.c||"—")+'</td><td>'+esc(r.p||"—")+'</td>'+
          '<td>'+(r.w?'<a href="'+esc(link(r.w))+'" target="_blank" rel="noopener" onclick="event.stopPropagation()">site ↗</a>':"—")+'</td></tr>';
        if(open){ row+='<tr class="ct-detail"><td colspan="5">'+
          (r.note?'<div class="t-sub" style="margin-bottom:7px">'+esc(r.note)+'</div>':'')+
          '<div class="ct-actions">'+
          (r.p?'<a href="tel:'+esc(r.p.replace(/[^0-9+]/g,""))+'">📞 Call</a>':'')+
          (r.e?'<a href="mailto:'+esc(r.e)+'">✉️ Email</a>':'')+
          (r.w?'<a href="'+esc(link(r.w))+'" target="_blank" rel="noopener">🌐 Open site</a>':'')+
          '<button class="ct-del" data-del="'+r._i+'">Remove</button>'+
          '</div></td></tr>'; }
        return row;
      }).join(""):'<tr><td colspan="5" style="color:var(--mut);padding:22px">Nothing matches — clear the search or import the master CSV.</td></tr>')+
      '</tbody></table></div>'+
      '<div class="srcnote">Seeded from the AE master book (hub leads + Kootenai practitioner file + the Jul 2026 stack recon). Blank phone/email means it isn\'t on file yet — blank beats wrong. In this preview, changes stay in this browser.</div>';

    var q=document.getElementById("ctQ");
    q.oninput=function(){ Q=this.value; OPEN=-1; render(); var qq=document.getElementById("ctQ"); qq.focus(); qq.setSelectionRange(qq.value.length,qq.value.length); };
    document.getElementById("ctV").onchange=function(){ FV=this.value; OPEN=-1; render(); };
    document.getElementById("ctC").onchange=function(){ FC=this.value; OPEN=-1; render(); };
    document.getElementById("ctS").onchange=function(){ SORT=this.value; render(); };
    document.getElementById("ctAdd").onclick=openAdd;
    document.getElementById("ctImp").onclick=openImp;
    document.getElementById("ctExp").onclick=doExport;
    Array.prototype.forEach.call(host.querySelectorAll("tbody tr[data-i]"),function(tr){
      tr.style.cursor="pointer";
      tr.onclick=function(){ var i=+this.dataset.i; OPEN=(OPEN===i?-1:i); render(); };
    });
    Array.prototype.forEach.call(host.querySelectorAll("[data-del]"),function(b){
      b.onclick=function(e){ e.stopPropagation(); ROWS.splice(+this.dataset.del,1); OPEN=-1; persist(); render(); T.toast("Removed. (Preview only — resets when you leave.)","ok"); };
    });
  }

  /* ---- add modal ---- */
  var modal=document.createElement("div"); modal.className="ct-modal"; document.body.appendChild(modal);
  function closeM(){ modal.classList.remove("on"); }
  modal.addEventListener("click",function(e){ if(e.target===modal) closeM(); });
  function openAdd(){
    modal.innerHTML='<div class="ct-mcard"><h3>Add a contact</h3>'+
    '<label>Business / name</label><input id="amN">'+
    '<div class="ct-mrow"><div><label>Category</label><input id="amV" placeholder="Developer, Contractor, Agency…"></div><div><label>City</label><input id="amC"></div></div>'+

  /* ---- import (file or paste), Barry-style header mapping ---- */
  function openImp(){
    modal.innerHTML='<div class="ct-mcard"><h3>Import the master CSV</h3>'+
    '<p style="font-size:13px;color:var(--mut);margin:0 0 6px">First row = headers. Recognized: name/account, first/last, category/vertical/industry, city, phone, email, website, notes. Duplicates (same name + city) are skipped.</p>'+

    '<label>…or paste CSV</label><textarea id="imT" rows="6" placeholder="Account Name,City,Phone,…"></textarea>'+
    '<div class="ct-actions" style="margin-top:14px"><button class="btn blue sm" id="imGo">Import</button><button class="btn sm" id="imX">Cancel</button></div></div>';
    modal.classList.add("on");
    document.getElementById("imX").onclick=closeM;
    document.getElementById("imF").onchange=function(e){ var f=e.target.files[0]; if(!f)return; var rd=new FileReader(); rd.onload=function(){ document.getElementById("imT").value=String(rd.result); }; rd.readAsText(f); };
    document.getElementById("imGo").onclick=function(){ doImport(document.getElementById("imT").value); };
  }
  function parseCSV(t){
    var rows=[],row=[],cur="",inq=false;
    for(var i=0;i<t.length;i++){ var ch=t[i];
      if(inq){ if(ch==='"'){ if(t[i+1]==='"'){cur+='"';i++;} else inq=false; } else cur+=ch; }
      else if(ch==='"') inq=true;
      else if(ch===','){ row.push(cur); cur=""; }
      else if(ch==='\n'||ch==='\r'){ if(cur!==""||row.length){ row.push(cur); rows.push(row); row=[]; cur=""; } if(ch==='\r'&&t[i+1]==='\n')i++; }
      else cur+=ch; }
    if(cur!==""||row.length){ row.push(cur); rows.push(row); }
    return rows;
  }
  function doImport(text){
    if(!text.trim()){ T.toast("Nothing to import.","warn"); return; }
    var rows=parseCSV(text); if(rows.length<2){ T.toast("Need a header row plus data.","warn"); return; }
    var H=rows[0].map(function(h){ return h.toLowerCase().replace(/[^a-z]/g,""); });
    function col(){ for(var i=0;i<arguments.length;i++){ var j=H.indexOf(arguments[i]); if(j>-1) return j; } return -1; }
    var iN=col("accountname","account","name","business","company"), iF=col("contactfirstname","firstname","first"),
        iL=col("contactlastname","lastname","last"), iV=col("vertical","category","industry","type","kind"),
        iC=col("city"), iP=col("phone","phonenumber"), iE=col("email"), iW=col("website","url","site"), iNo=col("notes","note");
    if(iN<0){ T.toast("No name/account column found.","warn"); return; }
    var have={}; ROWS.forEach(function(r){ have[(r.n+"|"+r.c).toLowerCase()]=1; });
    var added=0,skipped=0;
    rows.slice(1).forEach(function(r){
      var n=(r[iN]||"").trim(); if(!n) return;
      var city=iC>-1?(r[iC]||"").trim():"";
      var key=(n+"|"+city).toLowerCase();
      if(have[key]){ skipped++; return; }
      have[key]=1; added++;
      ROWS.push({ n:n, v:iV>-1?(r[iV]||"").trim():"", c:city, p:iP>-1?(r[iP]||"").trim():"",
        e:iE>-1?(r[iE]||"").trim():"", w:iW>-1?(r[iW]||"").trim():"",
        f:((iF>-1?r[iF]||"":"")+" "+(iL>-1?r[iL]||"":"")).trim(), note:iNo>-1?(r[iNo]||"").trim().slice(0,200):"", k:"Business" });
    });
    persist(); closeM(); OPEN=-1; render();
    T.toast("Imported "+added+" · skipped "+skipped+" duplicate(s).","ok");
  }
  function doExport(){
    var head="Account Name,Contact,Category,City,Phone,Email,Website,Notes";
    var lines=ROWS.map(function(r){ return [r.n,r.f||"",r.v||"",r.c||"",r.p||"",r.e||"",r.w||"",(r.note||"").replace(/"/g,"\'\'")].map(function(x){ return '"'+String(x).replace(/"/g,'""')+'"'; }).join(","); });
    var blob=new Blob([head+"\n"+lines.join("\n")],{type:"text/csv"});
    var a=document.createElement("a"); a.href=URL.createObjectURL(blob); a.download="mcarthur-contacts-"+new Date().toISOString().slice(0,10)+".csv"; a.click();
  }
  render();
})();
</script>
