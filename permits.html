<!DOCTYPE html>
<html lang="en"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Permits & AHJ · McArthur Engineering</title><link rel="icon" href="mca-mark.svg">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="truss.css"></head><body>
<script src="truss.js"></script>
<script>
(function () {
  var T = window.Truss, c = T.mount({ active:"permits.html", crumb:"Permits & AHJ" }), d = T.db();
  function verdictCard(key){ var r=T.consult(key); if(!r) return null; var v=r.verdict,p=r.passed,dp=r.dept;
    return T.card('<div class="between"><div><h2>'+T.esc(dp.name)+' · the org\'s read</h2><div class="card-sub">'+T.esc(dp.dh.line)+'</div></div><div>'+T.tag((p?"released":"held")+" · "+v.conf+"%",p?"good":"watch")+'</div></div><div class="fence'+(p?'':' amber')+'">'+T.esc(v.stance)+'</div><div class="conf"><span class="muted small">bar '+dp.gate+'%</span><span class="conf-bar"><i class="conf-fill '+(p?'':'under')+'" style="width:'+v.conf+'%"></i><span class="conf-gate" style="left:'+dp.gate+'%"></span></span><span class="conf-n">'+v.conf+'%</span></div><ul class="reasons">'+v.reasons.map(function(x){return '<li><span class="rtag '+x.t+'">'+x.t.toUpperCase()+'</span><span>'+T.esc(x.s)+'</span></li>';}).join("")+'</ul>'); }
  c.appendChild(T.page("Permits & AHJ","Agency review cycles and resubmittals — the thing no tool at this size tracks. A permit gates construction no matter how good the sealed set is."));
  c.appendChild(T.card('<h2>Agency reviews</h2><table><thead><tr><th>Project</th><th>Agency (AHJ)</th><th class="num">Cycle</th><th class="num">Comments</th><th style="width:130px">Resolved</th><th>Status</th></tr></thead><tbody>'+
    d.permits.map(function(p){var st=p.status==="Approved"?"good":(p.status==="In review"?"watch":"ghost");var rp=p.comments?Math.round(p.resolved/p.comments*100):0;
      return '<tr><td><div class="t-main">'+T.esc(p.project)+'</div><div class="t-sub">'+T.esc(p.note)+'</div></td><td class="small">'+T.esc(p.ahj)+'</td><td class="num">'+p.cycle+'</td><td class="num">'+p.resolved+' / '+p.comments+'</td><td><div class="bar '+(rp>=100?"good":"")+'"><i style="width:'+rp+'%"></i></div></td><td>'+T.tag(p.status,st)+'</td></tr>';}).join("")+'</tbody></table>'));
  var vc=verdictCard("permits"); if(vc) c.appendChild(vc);
})();
</script></body></html>
